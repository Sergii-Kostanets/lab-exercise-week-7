    <ul id="day-list"></ul>
    <script>
      const days = ['Monday', 'Tuesday', 'Wednesday'];
      const dayList = document.getElementById('day-list');
      for (const day of days) {
        const dayItem = document.createElement('li');
        dayItem.textContent = day;
      }
    </script>
