  <body>
    <h1>Puzzle 5</h1>
    <p><a id="info-link" href="https://example.org/old">More information</a></p>
    <p id="info-report"></p>
    <script>
      const infoLink = document.getElementById('info-link');
      const infoReport = document.getElementById('info-report');
      infoLink.setAttribute('href', 'https://example.org/new');
      infoReport.textContent = 'Goes to ' + infoLink.getAttribute('href');
    </script>
  </body>
