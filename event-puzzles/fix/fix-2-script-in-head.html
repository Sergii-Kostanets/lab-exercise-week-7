<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening news</title>
  </head>
  <body>
    <h1>Opening news</h1>
    <button id="news-button">Show the news</button>
    <p id="news-message">No news yet.</p>
    <script>
      const newsButton = document.getElementById('news-button');
      const newsMessage = document.getElementById('news-message');

      function showNews() {
        newsMessage.textContent = 'The cafe opens at eight.';
      }

      newsButton.addEventListener('click', showNews);
    </script>
  </body>
</html>
