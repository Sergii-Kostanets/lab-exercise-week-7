<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop notice</title>
    <style>
      .notice {
        padding: 8px;
        border: 2px solid gray;
      }

      .highlighted {
        background-color: lightyellow;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Shop notice</h1>
    <p id="shop-sign" class="notice">Shop closes at six</p>
    <button id="shop-button">Mark as important</button>
    <script>
      const shopSign = document.getElementById('shop-sign');
      const shopButton = document.getElementById('shop-button');

      function markImportant() {
        shopSign.classList.toggle('highlighted');
      }

      shopButton.addEventListener('click', markImportant);
    </script>
  </body>
</html>
