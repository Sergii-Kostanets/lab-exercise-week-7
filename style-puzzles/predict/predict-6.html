<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle 6</title>
    <style>
      .notice {
        padding: 8px;
        border: 2px solid gray;
      }

      .urgent {
        color: firebrick;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Puzzle 6</h1>
    <p id="sign" class="notice">Fresh bread today</p>
    <p id="report"></p>
    <script>
      const sign = document.getElementById('sign');
      const report = document.getElementById('report');
      sign.classList.add('.urgent');
      report.textContent = sign.className;
    </script>
  </body>
</html>
